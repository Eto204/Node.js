<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/empleados.js"></script>
    <title>Empleados</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <span class="navbar-brand">Recursos Humanos</span>
        <div>
            <a class="btn btn-sm btn-outline-light" href="empleados.html">Empleados</a>
            <a class="btn btn-sm btn-outline-light" href="registrar.html">Agregar</a>
        </div>
        <div class="text-light">
            <small id="user-mail"></small>
            <button class="btn btn-sm btn-light ml-2" id="btn-logout">Cerrar sesión</button>
        </div>
    </nav>
    <div class="container">
        <h3>Empleados <small class="text-muted" id="total"></small></h3>

        <form id="search-form" class="form-inline my-3">
            <input type="search" class="form-control mr-2" id="input-search" placeholder="Buscar por nombre">
            <button type="submit" class="btn btn-secondary">Buscar</button>
        </form>

        <table class="table table-bordered table-hover bg-white">
            <thead class="thead-light">
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="employees-body"></tbody>
        </table>
    </div>
</body>

</html>
