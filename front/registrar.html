<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/registrar.js"></script>
    <title>Agregar empleado</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <span class="navbar-brand">Recursos Humanos</span>
        <div>
            <a class="btn btn-sm btn-outline-light" href="empleados.html">Empleados</a>
            <a class="btn btn-sm btn-outline-light" href="registrar.html">Agregar</a>
        </div>
        <div class="text-light">
            <small id="user-mail"></small>
            <button class="btn btn-sm btn-light ml-2" id="btn-logout">Cerrar sesión</button>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h3 class="mb-3">Agregar empleado</h3>
                <form id="employee-form">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="input-nombre">Nombre</label>
                            <input type="text" class="form-control" id="input-nombre">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="input-apellidos">Apellidos</label>
                            <input type="text" class="form-control" id="input-apellidos">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="input-telefono">Teléfono</label>
                            <input type="tel" class="form-control" id="input-telefono">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="input-correo">Correo electrónico</label>
                            <input type="email" class="form-control" id="input-correo">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="input-direccion">Dirección</label>
                        <input type="text" class="form-control" id="input-direccion">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-secondary" href="empleados.html">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
