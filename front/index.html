<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/login.js"></script>
    <title>Iniciar sesión</title>
</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-1">Inicia sesión</h3>
                        <p class="text-muted">Taller de Node.js S.A. de C.V.</p>
                        <form id="login-form">
                            <div class="form-group">
                                <label for="input-mail">Correo electrónico</label>
                                <input type="email" class="form-control" id="input-mail" placeholder="correo@dominio.ext">
                            </div>
                            <div class="form-group">
                                <label for="input-password">Contraseña</label>
                                <input type="password" class="form-control" id="input-password" placeholder="***********">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
