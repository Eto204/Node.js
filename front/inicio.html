<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | HR Management</title>
  <meta name="description" content="Sistema de administración de empleados de Taller de Node.js S.A. de C.V.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body data-section="inicio">
  <div class="layout">
    <!-- Sidebar y encabezado: se generan en js/layout.js -->
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay"></div>

    <div class="content">
      <header class="header" id="header"></header>

      <main class="main">
        <div class="container">
          <div class="page-title">
            <h1>¡Bienvenido, Administrador!</h1>
            <p>Desde aquí puedes administrar la información de los empleados de tu empresa.</p>
          </div>

          <div class="stats">
            <div class="panel stat">
              <span class="stat-icon blue"><i data-lucide="users"></i></span>
              <div>
                <p class="label">Empleados registrados</p>
                <p class="value" id="total">0</p>
              </div>
            </div>

            <a class="panel stat stat-link" href="registrar.html">
              <span class="stat-icon teal"><i data-lucide="user-plus"></i></span>
              <div class="text">
                <p class="title">Nuevo empleado</p>
                <p class="label">Registra a un nuevo colaborador.</p>
              </div>
              <i data-lucide="arrow-right" class="arrow"></i>
            </a>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Empleados recientes</h3>
              <a class="link" href="empleados.html">Ver todos</a>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Correo electrónico</th>
                  </tr>
                </thead>
                <tbody id="recent-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
